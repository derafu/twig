# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/twig/resources/config/twig-services.yaml' }
#
# The components that the Twig environment registers are the services tagged
# `derafu_twig.component` (the ones of derafu/twig-components, for example). The
# one that creates the environment takes them in its `components` option:
#
#   components: !tagged_iterator derafu_twig.component
#
# The tag is explicit because _instanceof does not propagate across imported
# files, so it can't be shipped here to autotag services declared in your file.

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Twig\Translation\TwigTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
