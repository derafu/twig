# Default standalone Twig composition. Consumers may supply an existing
# Twig\Environment to TwigServiceInterface instead, without modifying it.
parameters:
    derafu.twig.options: {}
    derafu.twig.component_registrar.cache_key: derafu_twig_components_config

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Derafu\Twig\Contract\ComponentRegistrarInterface:
        class: Derafu\Twig\Service\ComponentRegistrar
        arguments:
            $cache: '@?Psr\Cache\CacheItemPoolInterface'
            $cacheKey: '%derafu.twig.component_registrar.cache_key%'

    Derafu\Twig\Contract\TwigCreatorInterface:
        class: Derafu\Twig\Service\TwigCreator
        arguments:
            $options: '%derafu.twig.options%'
            $componentRegistrar: '@Derafu\Twig\Contract\ComponentRegistrarInterface'
            $extensionProviders: !tagged_iterator derafu_twig.extension_provider
            $componentProviders: !tagged_iterator derafu_twig.component_provider

    Derafu\Twig\Contract\TwigServiceInterface:
        class: Derafu\Twig\Service\TwigService
        arguments:
            $twig: '@Derafu\Twig\Contract\TwigCreatorInterface'

    # Existing packages may tag their component classes individually.
    Derafu\Twig\Provider\IterableComponentProvider:
        arguments:
            $components: !tagged_iterator derafu_twig.component
        tags: ['derafu_twig.component_provider']

    # Consumer providers normally have priority 0 and precede these defaults.
    Derafu\Twig\Provider\DefaultExtensionProvider:
        arguments:
            $translator: '@?Symfony\Contracts\Translation\TranslatorInterface'
        tags:
            - name: derafu_twig.extension_provider
              priority: -1000

    Derafu\Twig\Translation\TwigTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
